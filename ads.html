<meta charset="utf-8">
<title>Ad Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Temporary test bench: cycle through every FakeAds creative. Not linked from the game. -->
<style>
  :root { color-scheme: dark; --bg: #0f1330; --panel: #1b2150; --line: rgba(190,205,255,.18); --text: #eef1ff; --muted: #9aa3d8; --gold: #ffcf5a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 600 14px/1.4 system-ui, sans-serif;
    display: flex; gap: 20px; align-items: center; justify-content: center; padding-block: 16px; padding-inline: 16px; }
  .phone { position: relative; flex: none; width: 375px; height: min(760px, calc(100dvh - 32px)); max-width: 100%;
    border-radius: 28px; overflow: hidden; background: #000; box-shadow: 0 0 0 8px #222, 0 30px 80px rgba(0,0,0,.6); }
  .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; }
  .panel { width: 300px; display: flex; flex-direction: column; gap: 12px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; color: var(--muted); }
  .row { display: flex; gap: 8px; }
  button, select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding-inline: 12px; cursor: pointer; }
  button.primary { background: var(--gold); color: #3b2800; border-color: transparent; font-weight: 800; }
  .row > * { flex: 1; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
  .log { font: 12px/1.5 ui-monospace, monospace; color: var(--muted); min-height: 3em; white-space: pre-line; }
  kbd { background: rgba(255,255,255,.1); border-radius: 4px; padding: 1px 5px; font: 700 11px/1.4 ui-monospace, monospace; color: var(--text); }
  @media (max-width: 720px) {
    body { flex-direction: column; align-items: stretch; }
    .phone { width: 100%; height: 72dvh; order: 2; }
    .panel { width: 100%; }
  }
</style>

<div class="phone" id="phone"><div class="empty">Pick an ad, or press Next.</div></div>
<div class="panel">
  <h1>Ad preview</h1>
  <p id="info">Parody ads from js/fakeads-creatives.js</p>
  <label>Ad <select id="pick"></select></label>
  <div class="row">
    <button id="prev">← Prev</button>
    <button id="next" class="primary">Next →</button>
  </div>
  <div class="row">
    <button id="random">Random</button>
    <button id="replay">Replay</button>
  </div>
  <label>Countdown
    <select id="countdown"><option value="0">0 s (X right away)</option><option value="3">3 s</option><option value="5" selected>5 s</option><option value="10">10 s</option></select>
  </label>
  <label><span><input type="checkbox" id="auto" checked> Advance when closed</span></label>
  <p>Keys: <kbd>←</kbd> <kbd>→</kbd> cycle, <kbd>R</kbd> replay.</p>
  <div class="log" id="log"></div>
</div>

<script src="js/fakeads.js"></script>
<script src="js/fakeads-creatives.js"></script>
<script>
  const list = FakeAds.catalog;
  const phone = document.getElementById('phone');
  const pick = document.getElementById('pick');
  const log = document.getElementById('log');
  const $ = (id) => document.getElementById(id);
  pick.innerHTML = list.map((c, i) => `<option value="${i}">${i + 1}. ${c.brand}</option>`).join('');
  let i = 0, ads = null, gen = 0;

  function play(n) {
    i = (n + list.length) % list.length;
    pick.value = String(i);
    const c = list[i];
    $('info').textContent = `${i + 1} of ${list.length} · ${c.id} · ${c.category || ''}${c.confirmshame ? ' · asks "are you sure?"' : ''}`;
    if (ads) ads.dismiss();
    phone.querySelector('.empty')?.remove();
    ads = FakeAds.create({ countdown: +$('countdown').value, container: phone, inline: true, captureKeys: false });
    const mine = ++gen;
    ads.show({ id: c.id }).then((r) => {
      if (mine !== gen) return; // replaced by another ad, not closed
      log.textContent = `closed ${r.id}${r.installed ? ' (tapped install)' : ''}\n` + log.textContent.split('\n').slice(0, 4).join('\n');
      if ($('auto').checked) setTimeout(() => { if (mine === gen) play(i + 1); }, 350);
    });
  }
  $('next').onclick = () => play(i + 1);
  $('prev').onclick = () => play(i - 1);
  $('random').onclick = () => play(Math.floor(Math.random() * list.length));
  $('replay').onclick = () => play(i);
  pick.onchange = () => play(+pick.value);
  $('countdown').onchange = () => play(i);
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight') play(i + 1);
    else if (e.key === 'ArrowLeft') play(i - 1);
    else if (e.key.toLowerCase() === 'r') play(i);
  });
  const fromHash = list.findIndex((c) => c.id === location.hash.slice(1));
  play(fromHash >= 0 ? fromHash : 0);
</script>
